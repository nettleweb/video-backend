plugins {
	id "java"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

group = "com.example"
version = "0.1.0"

jar {
	manifest {
		attributes('Main-Class': 'com.nettleweb.ytproxy.Main')
	}

	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	} {
		exclude "META-INF/*.SF"
		exclude "META-INF/*.DSA"
		exclude "META-INF/*.RSA"
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
	main {
		java {
			srcDir "src/java"
		}

		resources {
			srcDir "src/res"
		}
	}
}

compileJava {
	options.encoding = "utf-8"
	options.debug = true
	options.verbose = false
	options.warnings = true
	options.deprecation = true
	options.failOnError = false
}

repositories {
	google()
	maven { url = "https://jitpack.io" }
	maven { url = "https://maven.fabric.io/public" }
	mavenCentral()
}

dependencies {
	compileOnly "org.jetbrains:annotations:26.0.2"
	implementation "org.json:json:20260814"
	implementation "com.nettleweb:http:0.1.0"
	implementation "com.squareup.okhttp3:okhttp-jvm:5.5.0"
	implementation "com.github.TeamNewPipe:NewPipeExtractor:6a858368c86bc9a55abee586eb6c733e86c26b97"
}
